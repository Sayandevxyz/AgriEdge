  <line x1="50" y1="20" x2="72" y2="40" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8" />
  <line x1="28" y1="40" x2="50" y2="50" stroke="#FFFFFF" stroke-width="1" opacity="0.6" />
  <line x1="72" y1="40" x2="50" y2="50" stroke="#FFFFFF" stroke-width="1" opacity="0.6" />
